<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HouseholdBattle</title>
<meta name="description" content="Chores, but you're winning.">
<meta name="theme-color" content="#241E4E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<style>

/* Layout: test bench (control bar + two phones + event log) around a single-theme violet/gold game UI. Deliberately dark only. */
:root {
  color-scheme: dark;
  --bench-bg: #0F0C22;
  --bench-panel: #19153A;
  --bench-line: #2E2860;
  --bg: #241E4E;
  --bg-deep: #1E1942;
  --nav: #1A1640;
  --card: #2F2862;
  --card-2: #3A3275;
  --line: #4A4288;
  --ink: #F4F1FF;
  --muted: #B9B3E6;
  --soft: #D9D5F5;
  --gold: #FFC93C;
  --gold-ink: #241E4E;
  --coral: #FF7A59;
  --coral-text: #FF9A80;
  --grey: #8C85C4;
  --dim: rgba(9, 7, 22, 0.74);
  --display: Bungee, Rubik, "Arial Black", system-ui, sans-serif;
  --body: Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
  --phone-h: clamp(600px, calc(100dvh - 150px), 820px);
}
[hidden] { display: none !important; }
html, body { height: auto; }
body { background: var(--bench-bg); color: var(--ink); font-family: var(--body); margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#bench { max-width: 1440px; margin: 0 auto; padding-block: 16px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; }
.controls { background: var(--bench-panel); border: 1px solid var(--bench-line); border-radius: 16px; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.controls h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 16px; letter-spacing: 0.5px; color: var(--gold); }
.controls .intro { font-size: 13px; color: var(--muted); flex: 1 1 260px; min-width: 0; }
.ctl-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ctl-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
.clock { font-variant-numeric: tabular-nums; font-weight: 500; font-size: 14px; background: var(--bg-deep); border-radius: 8px; padding: 6px 10px; }
.clock small { color: var(--gold); font-weight: 400; }
.cbtn { height: 34px; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 0 10px; font-size: 13px; color: var(--ink); }
.cbtn:hover { background: var(--card); }
.cbtn.strong { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 700; }
.cbtn.on { background: var(--card-2); border-color: var(--gold); }
.viewtoggle { display: none; }
.confirm-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--soft); }

.stage { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 24px; }
.phone-col { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.phone-label { font-size: 13px; color: var(--muted); }
.phone-label b { color: var(--ink); }
.phone { width: 390px; max-width: 100%; height: var(--phone-h); box-sizing: border-box; border: 8px solid #07051A; border-radius: 36px; background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.45); }
.log-panel { width: 320px; max-width: 100%; height: var(--phone-h); box-sizing: border-box; background: var(--bench-panel); border: 1px solid var(--bench-line); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; margin-top: 27px; }
.log-panel h2 { margin: 0; padding: 12px 14px; font-size: 13px; font-family: var(--display); font-weight: 400; letter-spacing: 1px; color: var(--muted); border-bottom: 1px solid var(--bench-line); }
.log-list { flex: 1; overflow-y: auto; padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; line-height: 1.4; }
.log-item { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; }
.log-item time { color: var(--grey); font-variant-numeric: tabular-nums; }
.log-item span { color: var(--soft); overflow-wrap: anywhere; }
.log-item b { color: var(--gold); font-weight: 500; }

@media (max-width: 879px) {
  .viewtoggle { display: flex; }
  .controls .intro { display: none; }
  .controls { gap: 8px 12px; padding: 10px 12px; }
  .stage[data-view="A"] #col-B, .stage[data-view="B"] #col-A { display: none; }
  .phone-col { width: 100%; }
  .phone { width: 100%; max-width: 430px; border-width: 6px; border-radius: 30px; }
  .log-panel { width: 100%; max-width: 430px; height: 320px; margin-top: 0; }
}

/* Start chooser */
.start { position: fixed; inset: 0; background: var(--dim); display: flex; align-items: center; justify-content: center; z-index: 50; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.start-card { background: var(--bench-panel); border: 1px solid var(--bench-line); border-radius: 20px; padding: 24px; max-width: 520px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; }
.start-card h2 { margin: 0; font-family: var(--display); font-weight: 400; color: var(--gold); font-size: 20px; }
.start-card p { margin: 0; color: var(--soft); font-size: 14px; line-height: 1.5; }
.start-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.start-opt { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.start-opt:hover { border-color: var(--gold); }
.start-opt b { font-size: 15px; }
.start-opt span { font-size: 13px; color: var(--muted); line-height: 1.4; }

/* ---------- App inside phone ---------- */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-size: 14px; }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
.disp { font-family: var(--display); font-weight: 400; }
.muted { color: var(--muted); }
.gold { color: var(--gold); }
.coral { color: var(--coral-text); }

.hdr { background: var(--bg-deep); padding: 12px 18px 12px; display: flex; flex-direction: column; gap: 9px; flex: none; }
.hdr-top { display: flex; align-items: center; justify-content: space-between; }
.eyebrow { font-family: var(--display); font-size: 11px; letter-spacing: 1.5px; color: var(--muted); }
.iconbtn { width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.iconbtn:hover { background: var(--card); color: var(--ink); }
.vs { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.player { display: flex; align-items: center; gap: 9px; min-width: 0; }
.player.right { flex-direction: row-reverse; text-align: right; }
.avatar { width: 38px; height: 38px; flex: none; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 17px; }
.avatar.me { background: var(--gold); color: var(--gold-ink); }
.avatar.them { background: var(--coral); color: var(--gold-ink); }
.avatar.sm { width: 28px; height: 28px; border-radius: 8px; font-size: 12px; }
.avatar.dogav { padding: 0; background: none; border: 0; border-radius: 0; width: 46px; height: 46px; }
.avatar.dogav img { width: 100%; height: 100%; object-fit: contain; }
.player.right .avatar.dogav img { transform: scaleX(-1); }
.avatar.ghost { background: var(--card-2); color: var(--muted); }
.player-meta { display: flex; flex-direction: column; min-width: 0; }
.player-meta small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score-num { font-family: var(--display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.vs-word { font-family: var(--display); font-size: 12px; color: var(--grey); padding-bottom: 6px; }
.tug { position: relative; height: 12px; border-radius: 6px; overflow: hidden; display: flex; background: var(--card-2); }
.tug .l { background: var(--gold); transition: width 0.9s cubic-bezier(.2,.8,.2,1); }
.tug .r { flex: 1; background: var(--coral); }
.tug .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: var(--bg-deep); }
.tug.empty .r { background: var(--card-2); }
.cheeky { font-size: 13.5px; line-height: 1.35; }
.hdr .cheeky { text-align: center; padding-block: 8px; }
.sheet > *, .full-body > *, .ob > *, .page > *, .list > *, .composer > * { flex-shrink: 0; }
.gift { background: linear-gradient(160deg, #3A2F7A, #2A2360); border: 2px solid var(--gold); border-radius: 18px; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.gift .disp { color: var(--gold); font-size: 20px; }
.gift .gift-text { font-size: 18px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.gift small { color: var(--muted); font-size: 12.5px; }
.gift.pop { animation: pop 0.6s cubic-bezier(.2,1.4,.4,1); }
.combo-scale { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.combo-scale b { color: var(--gold); font-weight: 500; }
.lvlrow { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--gold); border-radius: 3px; transition: width 0.9s cubic-bezier(.2,.8,.2,1); }

.chips { display: flex; gap: 6px; padding: 12px 18px 16px; overflow-x: auto; flex: none; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips { cursor: grab; overscroll-behavior-x: contain; }
.chips.dragging { cursor: grabbing; user-select: none; }
.chips.fr { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); }
.chips.fl { -webkit-mask-image: linear-gradient(90deg, transparent, #000 36px); mask-image: linear-gradient(90deg, transparent, #000 36px); }
.chips.fl.fr { -webkit-mask-image: linear-gradient(90deg, transparent, #000 36px, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, transparent, #000 36px, #000 calc(100% - 36px), transparent); }
.fchip { height: 34px; flex: none; border: 1px solid var(--line); border-radius: 10px; padding: 0 11px; background: transparent; color: var(--ink); font-size: 13px; white-space: nowrap; }
.fchip.on { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 700; }
.fchip { display: inline-flex; align-items: center; gap: 7px; padding: 0 6px 0 11px; }
.fchip .cnt { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: var(--gold); color: var(--gold-ink); font-family: var(--display); font-size: 12px; line-height: 1; }
.fchip.on .cnt { background: var(--gold-ink); color: var(--gold); }
.fchip .cnt.zero { background: var(--card-2); color: var(--muted); }
.fchip.on .cnt.zero { background: rgba(36,30,78,0.25); color: var(--gold-ink); }
.score-num { display: inline-block; }
.score-num.bump { animation: bump 0.25s ease-out; }
@keyframes bump { 50% { transform: scale(1.3); } }
.coin { position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFF0B8, #FFC93C 55%, #C8941A); box-shadow: 0 0 12px rgba(255,201,60,0.8); z-index: 30; pointer-events: none; }
.float-xp { position: absolute; z-index: 30; pointer-events: none; font-family: var(--display); font-size: 24px; color: var(--coral-text); text-shadow: 0 2px 10px rgba(0,0,0,0.5); animation: floatUp 1.3s ease-out forwards; }
@keyframes floatUp { 0% { opacity: 0; transform: translateY(8px) scale(0.8); } 20% { opacity: 1; transform: translateY(0) scale(1.1); } 100% { opacity: 0; transform: translateY(-40px) scale(1); } }
.tug.glow { animation: glow 1.4s ease-out; }
@keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(255,122,89,0); } 30% { box-shadow: 0 0 16px 4px rgba(255,122,89,0.8); } 100% { box-shadow: 0 0 0 0 rgba(255,122,89,0); } }
.stamp { position: absolute; left: 50%; z-index: 31; pointer-events: none; transform: translate(-50%, -50%) rotate(-8deg); border: 4px solid var(--coral); color: var(--coral-text); background: rgba(18,15,40,0.92); font-family: var(--display); font-size: 21px; line-height: 1.1; padding: 10px 16px; border-radius: 12px; text-align: center; white-space: nowrap; animation: stamp 0.45s cubic-bezier(.2,1.4,.4,1); }
.stamp.out { transition: opacity 0.4s; opacity: 0; }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-8deg) scale(2.4); opacity: 0; } to { transform: translate(-50%, -50%) rotate(-8deg) scale(1); opacity: 1; } }
.hdr.shake { animation: shake 0.45s; }
@keyframes shake { 15% { transform: translateX(-7px); } 35% { transform: translateX(7px); } 55% { transform: translateX(-5px); } 75% { transform: translateX(4px); } }
/* Simulated phone home screen */
.home { position: absolute; inset: 0; background: radial-gradient(circle at 30% 18%, #3D3290, #120F28 72%); display: flex; flex-direction: column; align-items: center; padding: 56px 22px 28px; box-sizing: border-box; color: var(--ink); }
.home .h-time { font-size: 60px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
.home .h-date { color: var(--soft); font-size: 15px; margin-top: 8px; }
.home .h-hint { color: var(--muted); font-size: 13px; margin-top: auto; margin-bottom: 18px; text-align: center; }
.apps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px 12px; width: 100%; }
.appi { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: var(--soft); border: 0; background: transparent; position: relative; padding: 0; cursor: default; }
.appi i { width: 56px; height: 56px; border-radius: 16px; display: block; }
.appi.qr { cursor: pointer; }
.appi.qr i { background: var(--gold); color: var(--gold-ink); font-family: var(--display); font-style: normal; font-size: 17px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(255,201,60,0.35); }
.appi .ibadge { position: absolute; top: -6px; right: calc(50% - 36px); min-width: 22px; height: 22px; border-radius: 11px; background: var(--coral); color: var(--gold-ink); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px; box-sizing: border-box; }
.gifimg { display: block; max-width: 180px; max-height: 150px; border-radius: 8px; }
.gifimg.sticker { border-radius: 0; max-height: 160px; }
.dogcard { display: inline-flex; align-self: flex-start; padding: 0; background: none; border: 0; }
.dogcard img { display: block; width: 150px; height: auto; }
.msg { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

.gif-att .dogcard img { width: 60px; }
.banner .dogcard img { width: 110px; }
.style-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.style-card { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.style-card img { width: 72px; height: 72px; object-fit: contain; }
.style-card b { font-size: 13.5px; }
.style-card small { font-size: 11.5px; color: var(--muted); }
.style-card.on { border: 2px solid var(--gold); background: var(--card-2); }
.style-card:disabled { opacity: 0.4; filter: grayscale(1); }
.confirm { display: flex; flex-direction: column; gap: 12px; padding: 6px 0 4px; }
.confirm h3 { margin: 0; }
.dog-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.dog-tile { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--soft); }
.dog-tile img { width: 100%; aspect-ratio: 1; object-fit: contain; }
.dog-tile:hover, .dog-tile.on { border-color: var(--gold); }
.dog-tile.on { background: var(--card-2); }
.nchip .chipmeme { width: 26px; height: 26px; object-fit: contain; vertical-align: middle; margin: -4px 6px -4px -4px; }
.gifph { display: flex; align-items: center; justify-content: center; text-align: center; width: 160px; height: 104px; border-radius: 10px; font-family: var(--display); font-size: 14px; line-height: 1.1; color: #fff; padding: 6px; box-sizing: border-box; background: linear-gradient(135deg, hsl(var(--h) 70% 48%), hsl(calc(var(--h) + 70) 65% 32%)); background-size: 220% 220%; animation: gifbg 1.8s ease-in-out infinite alternate; text-shadow: 0 2px 0 rgba(0,0,0,0.35); }
.gifph span { animation: gifbob 0.9s ease-in-out infinite alternate; display: inline-block; }
@keyframes gifbg { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
@keyframes gifbob { from { transform: translateY(-3px) rotate(-3deg); } to { transform: translateY(3px) rotate(3deg); } }
.bubble .gifimg, .bubble .gifph { margin-bottom: 4px; }
.gif-att { display: flex; align-items: center; gap: 10px; }
.gif-att .gifimg, .gif-att .gifph { width: 96px; height: 64px; max-width: 96px; object-fit: cover; font-size: 10px; }
.gifpick { position: absolute; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
.gp-top { display: flex; align-items: center; gap: 6px; padding: 10px 12px; flex: none; }
.gp-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 4px 12px 12px; align-content: start; }
.gp-tile { border: 0; padding: 0; background: var(--card); border-radius: 10px; overflow: hidden; height: 110px; display: flex; }
.gp-tile:hover { outline: 2px solid var(--gold); }
.gp-tile .gifimg, .gp-tile .gifph { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; border-radius: 0; }
.gp-foot { flex: none; padding: 8px 12px 12px; font-size: 11.5px; color: var(--muted); text-align: center; }
.gp-foot b { color: var(--ink); }
.gif-ctl input { height: 32px; width: 190px; max-width: 100%; box-sizing: border-box; background: var(--bg-deep); border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { .gifph, .gifph span { animation: none; } }
.act-row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.act-link { border: 0; background: transparent; padding: 0; text-align: left; color: inherit; cursor: pointer; }
.act-link:hover .act-txt { color: var(--ink); }
.reply { display: flex; gap: 8px; align-items: flex-start; margin-top: 2px; padding-left: 10px; border-left: 2px solid var(--card-2); }
.reply .bubble { margin: 0; }
.rbtn { align-self: flex-start; height: 30px; border: 1px solid var(--line); background: transparent; color: var(--gold); border-radius: 8px; padding: 0 10px; font-size: 12.5px; font-weight: 500; }
.rbtn:hover { border-color: var(--gold); }
.rbtn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.act-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.done-row .rbtn { align-self: center; }
.cbtn.sm { height: 28px; font-size: 12px; padding: 0 9px; margin-left: 6px; }
@media (prefers-reduced-motion: reduce) { .score-num.bump, .tug.glow, .hdr.shake, .stamp, .float-xp { animation: none; } }

.list { padding: 4px 18px 96px; display: flex; flex-direction: column; gap: 9px; }
.task { background: var(--card); border: 2px solid transparent; border-radius: 14px; display: flex; align-items: center; gap: 4px; padding: 0 12px 0 6px; }
.task.old { border-color: var(--gold); }
.tick { width: 44px; height: 44px; flex: none; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; }
.tick i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--grey); box-sizing: border-box; display: block; transition: background 0.15s, border-color 0.15s; }
.task.old .tick i { border-color: var(--gold); }
.tick:hover:not(:disabled) i { border-color: var(--gold); background: rgba(255,201,60,0.18); }
.tick:disabled i { opacity: 0.35; border-style: dashed; }
.task.locked .xp { opacity: 0.6; }
.row-body { flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; padding: 11px 4px; display: flex; flex-direction: column; gap: 3px; }
.row-title { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.row-sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.row-sub.gold { color: var(--gold); }
.row-sub.coral { color: var(--coral-text); }
.xp { flex: none; background: var(--card-2); color: var(--gold); font-weight: 700; font-size: 13.5px; border-radius: 10px; padding: 6px 9px; font-variant-numeric: tabular-nums; }
.task.old .xp { background: var(--gold); color: var(--gold-ink); }
.info-card .tipx { width: 30px; height: 30px; margin: -4px -6px -4px 0; flex: none; }

.linkrow { height: 44px; border: 0; border-top: 1px solid var(--card-2); background: transparent; color: var(--muted); font-size: 13.5px; display: flex; align-items: center; justify-content: space-between; padding: 0 2px; width: 100%; }
.empty { text-align: center; padding: 36px 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; color: var(--soft); }

.fab { position: absolute; right: 16px; bottom: 80px; width: 56px; height: 56px; border-radius: 16px; border: 0; background: var(--gold); color: var(--gold-ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,0.35); z-index: 5; }

.nav .dot { position: absolute; top: 10px; left: calc(50% + 8px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--coral); color: var(--gold-ink); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-sizing: border-box; }

.banner { flex: none; padding: 10px 18px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; background: #4A3A8F; }

.bubble { background: rgba(255,255,255,0.1); border-radius: 10px 10px 10px 2px; padding: 6px 10px; font-size: 13px; align-self: flex-start; max-width: 100%; overflow-wrap: anywhere; }
.bubble.me { background: rgba(255,201,60,0.16); }
.bubble.them { background: rgba(255,122,89,0.18); }

/* Sheets */
.overlay { position: absolute; inset: 0; background: var(--dim); display: flex; flex-direction: column; justify-content: flex-end; z-index: 20; }
.overlay-hit { flex: 1; border: 0; background: transparent; cursor: default; }
.sheet { background: var(--card); border-radius: 24px 24px 0 0; max-height: 94%; overflow-y: auto; overscroll-behavior: contain; padding: 10px 20px 20px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; }
.sheet.enter { animation: up 0.28s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.grab { width: 40px; height: 4px; border-radius: 2px; background: #5A5296; align-self: center; flex: none; }
.sheet-top { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.sheet-top .ttl { flex: 1; font-family: var(--display); font-size: 14px; letter-spacing: 1px; color: var(--gold); }
.sheet h3 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 8px 12px; font-size: 13.5px; }

.btn { min-height: 52px; flex-shrink: 0; border: 0; border-radius: 14px; font-size: 15px; font-weight: 700; padding: 0 16px; }
.btn.gold { background: var(--gold); color: var(--gold-ink); font-family: var(--display); font-weight: 400; letter-spacing: 0.5px; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
.btn.plain { background: transparent; color: var(--muted); font-weight: 500; }
.btn.sm3 { font-size: 13.5px; padding: 0 8px; min-height: 46px; }
.btn-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.btn-grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.btn-grid .btn { width: 100%; }
.btn.stealbtn { font-family: var(--body); font-weight: 700; letter-spacing: 0; font-size: 13.5px; }
.btn.danger { background: transparent; border: 1px solid #7E4A6A; color: var(--coral-text); font-weight: 500; }
.btn:disabled { opacity: 0.45; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.thread { display: flex; flex-direction: column; gap: 6px; }
.thread small { font-size: 11.5px; color: var(--muted); }

.steps { display: flex; gap: 6px; }
.steps i { width: 8px; height: 8px; border-radius: 4px; background: var(--card-2); }
.steps i.on { background: var(--gold); width: 20px; }
.field { width: 100%; height: 48px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 0 14px; font-size: 15px; color: var(--ink); }
.field::placeholder { color: var(--grey); }
.field:focus { border-color: var(--gold); outline: none; }
.lbl { font-size: 12.5px; color: var(--muted); }
.sugg { display: flex; flex-wrap: wrap; gap: 8px; }
.sugg button { min-height: 44px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 0 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.sugg button b { color: var(--gold); font-size: 12.5px; }
.sugg button:hover { border-color: var(--gold); }
.bigopts { display: flex; flex-direction: column; gap: 8px; }
.bigopt { min-height: 58px; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 10px 14px; text-align: left; display: flex; align-items: center; gap: 12px; }
.bigopt:hover, .bigopt.on { border-color: var(--gold); }
.bigopt.on { background: var(--card-2); }
.bigopt .bt { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bigopt .bt b { font-size: 15px; }
.bigopt .bt span { font-size: 12.5px; color: var(--muted); }
.bigopt .bx { font-family: var(--display); color: var(--gold); font-size: 15px; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }

.stepper { display: flex; align-items: center; gap: 10px; font-size: 14px; }

.textlink { border: 0; background: transparent; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 8px 0; }
.sum-block { display: flex; flex-direction: column; gap: 8px; }
.xp-preview { font-size: 14px; color: var(--soft); }
.xp-preview b { color: var(--gold); font-family: var(--display); font-weight: 400; }

/* Composer */
.composer { display: flex; flex-direction: column; gap: 8px; }
.composer .chiprow { display: flex; flex-wrap: wrap; gap: 8px; }
.nchip { min-height: 42px; border: 1px solid #5A5296; background: transparent; border-radius: 12px; padding: 0 12px; font-size: 13.5px; text-align: left; }
.nchip:hover { border-color: var(--gold); }
.nchip.on { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 500; }
.nchip.icon { width: 42px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.own { display: flex; gap: 8px; }
.own .field { flex: 1; min-width: 0; height: 44px; }
.own .btn { min-height: 44px; height: 44px; }

/* Reward */
.reward-head { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.reward-kicker { font-family: var(--display); font-size: 13px; letter-spacing: 2px; color: var(--gold); }
.reward-xp { font-family: var(--display); font-size: 56px; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }

.strip { display: flex; align-items: center; gap: 12px; background: var(--card-2); border-radius: 14px; padding: 10px 13px; }

.lvlbox { width: 40px; height: 40px; flex: none; border-radius: 11px; background: var(--gold); color: var(--gold-ink); font-family: var(--display); font-size: 19px; display: flex; align-items: center; justify-content: center; }

/* Toast */
.toast { position: absolute; left: 12px; right: 12px; bottom: 74px; z-index: 15; background: #120F28; border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
.toast.enter { animation: up 0.22s ease-out; }
.toast-row { display: flex; align-items: center; gap: 6px; }
.toast-txt { flex: 1; min-width: 0; font-size: 13.5px; }
.toast-txt b { color: var(--gold); }
.toast-txt small { display: block; color: var(--muted); font-size: 12px; }
.tbtn { height: 36px; border: 0; background: transparent; color: var(--gold); font-weight: 500; font-size: 13px; padding: 0 9px; border-radius: 8px; }
.tbtn:hover { background: var(--card); }

/* Score */
.page { padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 14px; }
.page-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.page-title h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: 1px; }
.toggle { display: flex; background: var(--nav); border-radius: 10px; padding: 3px; }
.toggle button { height: 32px; border: 0; border-radius: 8px; padding: 0 11px; background: transparent; color: var(--muted); font-size: 12.5px; }
.toggle button.on { background: var(--gold); color: var(--gold-ink); font-weight: 700; }
.panel { background: var(--bg-deep); border-radius: 16px; padding: 14px 15px; display: flex; flex-direction: column; gap: 10px; }
.stats { display: flex; flex-direction: column; }
.stats .r { display: grid; grid-template-columns: minmax(0, 1fr) 58px 58px; align-items: center; min-height: 34px; border-top: 1px solid var(--card-2); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.stats .r:last-child { border-bottom: 1px solid var(--card-2); }
.stats .r.h { font-size: 11.5px; color: var(--muted); border-top: 0; min-height: 22px; }
.stats .r span:nth-child(2), .stats .r span:nth-child(3) { text-align: right; }
.badges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.badge { min-height: 84px; border: 1px dashed var(--line); background: transparent; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11.5px; color: var(--muted); padding: 6px 4px; text-align: center; }
.badge.earned { border: 0; background: var(--card); color: var(--ink); }
.badge.earned.rare { border: 2px solid var(--coral); }
.badge.hidden { border-color: #6B4A6E; color: var(--coral-text); }
.badge.sel { outline: 2px solid var(--gold); outline-offset: 1px; }
.badge-pop { background: var(--card); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.badge-pop b { font-size: 15px; }
.badge-pop span { color: var(--muted); }

/* Activity */
.day-h { font-family: var(--display); font-size: 11px; letter-spacing: 1.5px; color: var(--muted); margin-top: 6px; }
.act { display: flex; gap: 10px; align-items: flex-start; border: 0; background: transparent; text-align: left; padding: 6px 0; width: 100%; }
.act.link { cursor: pointer; }
.act.link:hover .act-txt { color: var(--ink); }
.act-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.act-txt { font-size: 13.5px; line-height: 1.35; color: var(--soft); overflow-wrap: anywhere; }
.act-txt b { color: var(--ink); font-weight: 500; }
.act.noted .act-txt { color: var(--ink); }
.act-time { font-size: 11.5px; color: var(--grey); }
.show-card { background: var(--card); border: 1px solid var(--gold); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.show-card ul { margin: 0; padding-left: 16px; color: var(--soft); }

/* Settings / onboarding full screens */
.full { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 10; }
.full-top { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px; flex: none; }
.full-top h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 16px; letter-spacing: 1px; }
.full-body { flex: 1; overflow-y: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 18px; }
.sect { display: flex; flex-direction: column; gap: 8px; }
.sect h4 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 12px; letter-spacing: 1px; color: var(--muted); }
.sect p { margin: 0; font-size: 13.5px; color: var(--soft); line-height: 1.45; }
.ob { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 28px 22px 24px; gap: 18px; overflow-y: auto; box-sizing: border-box; background: var(--bg); }
.ob h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.15; color: var(--gold); }
.ob p { margin: 0; color: var(--soft); font-size: 14.5px; line-height: 1.5; }
.ob .grow { flex: 1; }
.ob .logo { font-family: var(--display); font-size: 34px; line-height: 1.05; color: var(--gold); margin-top: 40px; }
.code { font-family: var(--display); font-size: 34px; letter-spacing: 6px; color: var(--gold); background: var(--bg-deep); border-radius: 14px; padding: 14px; text-align: center; user-select: all; }
.err { color: var(--coral-text); font-size: 13px; }
.ok { color: var(--gold); font-size: 14px; }
.starter { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.starter button { min-height: 56px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; text-align: left; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.starter button small { color: var(--muted); font-size: 11.5px; }
.starter button.on { border: 2px solid var(--gold); background: var(--card-2); }
.is-paused .list, .is-paused .hdr { filter: saturate(0.4); }

@media (prefers-reduced-motion: reduce) {
  .sheet.enter, .toast.enter, .reward-xp.pop { animation: none; }
  .tug .l, .bar > i { transition: none; }
}

/* ---------- Real app: one full-screen phone instead of the test bench ---------- */
html, body { height: 100%; }
body { background: var(--bg); overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
#phone.phone {
  position: fixed; left: 0; right: 0; margin: 0 auto;

}
