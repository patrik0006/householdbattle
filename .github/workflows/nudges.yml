name: Nudges
# Every 5 minutes: send pushes for challenges, rewards and help requests, plus the daily nudge when it's due.
# Also copies feedback notes from the app into feedback/inbox.md.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nudges
  cancel-in-progress: false
jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: nudger
      - run: node run.mjs
        working-directory: nudger
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TZ: Europe/Stockholm
      - name: Collect feedback
        working-directory: nudger
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node feedback.mjs
          cd ..
          if [ -f feedback/.fb-ack.json ] && [ -n "$(git status --porcelain feedback/inbox.md)" ]; then
            git config user.name "householdbattle-bot"
            git config user.email "householdbattle-bot@users.noreply.github.com"
            git add feedback/inbox.md
            git commit -m "Feedback from the app"
            git pull --rebase origin main && git push origin HEAD:main
          fi
          if [ -f feedback/.fb-ack.json ]; then cd nudger && node feedback.mjs --ack; fi
